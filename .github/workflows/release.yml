# Runs on a `v*` tag push. Checks the tagged commit, fast-forwards main, and publishes the VSIX.
name: Release

on:
  push:
    tags: ['v*']

jobs:
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml

  release:
    needs: checks
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($version)"
            exit 1
          fi

      - name: Package
        id: package
        run: echo "vsix=$(node scripts/package.js)" >> "$GITHUB_OUTPUT"

      # The checkout authenticates with GITHUB_TOKEN, so this push does not start a second check run.
      - name: Fast-forward main to the tagged commit
        run: git push origin HEAD:refs/heads/main

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.vsix }}" --title "$GITHUB_REF_NAME" --generate-notes

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: |
          curl --fail-with-body -sS -X POST -H "Content-Type: application/octet-stream" \
            --data-binary "@${{ steps.package.outputs.vsix }}" \
            "https://open-vsx.org/api/-/publish?token=$OVSX_PAT"

      - name: Open VSX token missing
        if: env.OVSX_PAT == ''
        run: |
          echo "::warning::OVSX_PAT is not set: the VSIX is on the GitHub release only, not on Open VSX"
